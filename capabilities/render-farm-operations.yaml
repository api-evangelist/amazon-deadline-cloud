id: https://api-evangelist.github.io/amazon-deadline-cloud/capabilities/render-farm-operations.yaml
name: Render Farm Operations
description: Workflow-oriented Naftiko capability for render farm management using Amazon Deadline Cloud, covering farm setup, job submission, monitoring, and fleet scaling for VFX and animation production.
version: 1.0.0-alpha1
specificationVersion: 1.0.0-alpha1

tags:
  - Rendering
  - Visual Effects
  - Animation
  - Cloud Computing
  - Media Production

imports:
  - url: capabilities/shared/deadline-cloud.yaml
    as: deadlineCloud

personas:
  - name: Render Wrangler
    description: Technical artist managing render job submission, priorities, and farm utilization
  - name: Infrastructure Engineer
    description: Engineer provisioning and maintaining render farm infrastructure and compute fleets
  - name: Production Coordinator
    description: Coordinator monitoring render progress and ensuring on-time delivery

workflows:
  - name: Set Up Render Farm
    description: Provision a complete render farm with queues and fleets for production
    steps:
      - step: createFarm
        capability: deadlineCloud
        description: Create the render farm
      - step: createQueue
        capability: deadlineCloud
        description: Create a job queue for rendering submissions
      - step: createFleet
        capability: deadlineCloud
        description: Create a compute fleet with appropriate instance types
    persona: Infrastructure Engineer

  - name: Monitor Active Renders
    description: Monitor the status and progress of active rendering jobs
    steps:
      - step: listJobs
        capability: deadlineCloud
        description: List all active jobs in the render queue
      - step: getJob
        capability: deadlineCloud
        description: Get detailed status of specific jobs
      - step: listWorkers
        capability: deadlineCloud
        description: Check worker utilization in the fleet
    persona: Render Wrangler

  - name: Manage Job Priorities
    description: Adjust job priorities to optimize farm utilization for deadlines
    steps:
      - step: listJobs
        capability: deadlineCloud
        description: Review jobs and their current priorities
      - step: updateJob
        capability: deadlineCloud
        description: Update job priority to meet production deadline
    persona: Production Coordinator

rest:
  port: 8080
  baseURL: https://deadline.amazonaws.com
  auth:
    type: aws-signature-v4
    service: deadline

mcp:
  port: 9090
  tools:
    - name: setup_render_farm
      description: Create a render farm with queues and compute fleets
      workflow: Set Up Render Farm
    - name: monitor_active_renders
      description: Monitor the status of active rendering jobs and worker utilization
      workflow: Monitor Active Renders
    - name: manage_job_priorities
      description: Adjust rendering job priorities to meet production deadlines
      workflow: Manage Job Priorities
    - name: list_jobs
      description: List rendering jobs in a queue
      operationId: listJobs
